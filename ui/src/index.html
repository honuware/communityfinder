<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CommunityFinder</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Angular Material fonts. WITHOUT the Material Icons font every <mat-icon>
       renders its ligature NAME as text ("edit", "delete", "arrow_drop_down"),
       which clips inside icon-sized buttons; WITHOUT Roboto, Material typography
       falls back to system fonts. (Mirrors knottyyoga; consider self-hosting via
       @fontsource later so visitor IPs don't leak to Google.) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
