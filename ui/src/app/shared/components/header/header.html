<mat-toolbar class="app-header">
  <a routerLink="/" class="app-header__brand">
    <span class="app-header__mark" aria-hidden="true"></span>
    <span class="app-header__site-name">{{ siteName }}</span>
  </a>
  <a
    mat-button
    routerLink="/events"
    routerLinkActive="app-header__nav--active"
    class="app-header__nav"
    >Events</a
  >
  <a
    mat-button
    routerLink="/guide"
    routerLinkActive="app-header__nav--active"
    class="app-header__nav"
    >Guide</a
  >
  <span class="app-header__spacer"></span>

  @if (user(); as u) {
    <button mat-button [matMenuTriggerFor]="menu" class="app-header__chip">
      <img
        class="app-header__avatar"
        [src]="avatarUrl(u.personId)"
        alt=""
        (error)="onAvatarError($event)"
      />
      <span class="app-header__name">{{ u.firstName }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <a mat-menu-item routerLink="/account">My account</a>
      @if (u.isAdmin) {
        <a mat-menu-item routerLink="/admin">Admin Dashboard</a>
        <a mat-menu-item routerLink="/admin/tables">Manage Data</a>
      }
      <button mat-menu-item (click)="logout()">Logout</button>
    </mat-menu>
  } @else {
    <a mat-button routerLink="/login">Login</a>
    <a mat-button routerLink="/register" class="app-header__register">Register</a>
  }
</mat-toolbar>
