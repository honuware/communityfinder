<footer class="app-footer">
  <div class="app-footer__inner">
    <div class="app-footer__about">
      <span class="app-footer__name">{{ siteName }}</span>
      <span class="app-footer__tagline">
        What's on, where to go and who to meet in Seattle and King County.
      </span>
      <span class="app-footer__intake">
        Know of an event? <a routerLink="/events/submit">Submit it here</a>. It's the only way we
        take listings.
      </span>
    </div>
    <nav class="app-footer__links" aria-label="Site">
      <a routerLink="/events">Events</a>
      <a routerLink="/events/calendar">Calendar</a>
      <a routerLink="/events/series">Recurring</a>
      <a routerLink="/guide">Guide</a>
      <a routerLink="/guide/venues">Venues</a>
      <a routerLink="/guide/orgs">Organizations</a>
      <a routerLink="/events/submit">Submit an event</a>
    </nav>
  </div>
  <div class="app-footer__legal">&copy; {{ year }} {{ siteName }}</div>
</footer>
